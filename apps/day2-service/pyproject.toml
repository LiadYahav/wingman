[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wingman-day2-service"
version = "0.2.0"
description = "Wingman day2: charts on clusters through the gitops-day2 team repos"
requires-python = ">=3.13,<3.14"
# Exact pins (ADR-0003); the same versions wingman-core pins, where both use one.
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "prometheus-client==0.26.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "uvicorn[standard]==0.54.0",
    "wingman-core",
]

[tool.uv.sources]
wingman-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/wingman_day2"]

[tool.deptry.per_rule_ignores]
# The server the image's CMD runs; nothing imports it.
DEP002 = ["uvicorn"]
