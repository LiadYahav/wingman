[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wingman-day1-service"
version = "0.2.0"
description = "Wingman day1: hosted-cluster values files in gitops-day1/platform-config, through merge requests"
requires-python = ">=3.13,<3.14"
# Exact pins (ADR-0003). Each is imported directly by wingman_day1.
dependencies = [
    "wingman-core",
    "fastapi==0.141.1",
    # The MCE hub APIs, OpenShift OAuth and day2 are reached over httpx, as
    # GitLab is (ADR-0002): no sync kubernetes client in a thread.
    "httpx==0.28.1",
    # Renders the shared cluster template, in a sandbox (ADR-0013).
    "jinja2==3.1.6",
    # The per-app metrics registry built in main.py (ADR-0010).
    "prometheus-client==0.26.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    # The server the image runs (CMD uvicorn wingman_day1.main:app); never imported.
    "uvicorn[standard]==0.54.0",
]

[tool.uv.sources]
wingman-core = { workspace = true }

[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn"]

[tool.hatch.build.targets.wheel]
packages = ["src/wingman_day1"]
