# Wingman's Python workspace: one lockfile (uv.lock) and one tooling config for
# every Python package. Each member keeps its own pyproject for its runtime
# dependencies; versions are pinned exactly there (ADR-0003).

[tool.uv.workspace]
members = [
    "packages/wingman-core",
    "apps/day1-service",
    "apps/day2-service",
]

[tool.uv]
required-version = ">=0.13,<0.14"

[dependency-groups]
dev = [
    "hypothesis==6.170.15",
    "import-linter==2.15",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.0.0",
    "ruff==0.14.0",
    "ty==0.0.78",
]
# The build backend every member's [build-system] names. Pinned here so
# uv.lock covers it and scripts/export-requirements.sh exports it with hashes:
# the images build the workspace members' wheels offline with exactly this
# version (docs/ops/images.md). Bump it with the members' build-system.
build = ["hatchling==1.32.4"]

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["packages/wingman-core/tests", "apps/day1-service/tests", "apps/day2-service/tests", "tests/repo"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
markers = [
    "live_gitlab: runs against a real GitLab; skipped unless WINGMAN_TEST_GITLAB_URL and WINGMAN_TEST_GITLAB_TOKEN are set",
]
filterwarnings = ["error"]

# ── coverage ────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["wingman_core", "wingman_day1", "wingman_day2"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

# ── ruff ────────────────────────────────────────────────────────────────────
# The rule set is server-scan's, plus BLE001 (no blind `except Exception`),
# C901 at 12 and PLR0915 (functions stay small, ADR-0056: an existing offender
# carries `# noqa: C901 - baseline: <why>`; RUF100 fails a noqa no longer needed).
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["apps/web", "node_modules", "dev/gitlab-fixtures"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S", "W605",
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206",
    "PTH", "LOG", "RET", "PERF", "FURB", "TRY004", "TRY300", "TRY400", "D", "BLE001",
    "C90", "PLR0915",
]
ignore = ["D203", "D212"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["wingman_core", "wingman_day1", "wingman_day2"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311", "D"]
"**/testing/**" = ["S101", "D102"]
"scripts/**" = ["T201"]

# ── ty ──────────────────────────────────────────────────────────────────────
[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unused-awaitable = "error"
blanket-ignore-comment = "error"

# Vendored verbatim from a team repo (day2's render_chain.py oracle); not ours to retype.
[tool.ty.src]
exclude = ["apps/day2-service/tests/oracle/render_chain.py"]

# ── import-linter: the layer rules (ADR-0001) ───────────────────────────────
[tool.importlinter]
root_packages = ["wingman_core", "wingman_day1", "wingman_day2"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core domain is pure: no I/O libraries and no outer layers"
type = "forbidden"
source_modules = ["wingman_core.domain"]
forbidden_modules = [
    "wingman_core.ports", "wingman_core.application", "wingman_core.infrastructure",
    "wingman_core.web", "wingman_core.testing",
    "fastapi", "starlette", "httpx", "pydantic_settings", "prometheus_client", "structlog",
]

[[tool.importlinter.contracts]]
name = "core ports depend only on the domain"
type = "forbidden"
source_modules = ["wingman_core.ports"]
forbidden_modules = [
    "wingman_core.application", "wingman_core.infrastructure", "wingman_core.web",
    "fastapi", "starlette", "httpx",
]

[[tool.importlinter.contracts]]
name = "core infrastructure does not depend on web"
type = "forbidden"
source_modules = ["wingman_core.infrastructure"]
forbidden_modules = ["wingman_core.web", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "core observability does not depend on web"
type = "forbidden"
source_modules = ["wingman_core.observability"]
forbidden_modules = ["wingman_core.web", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "core application depends only on the domain and ports"
type = "forbidden"
source_modules = ["wingman_core.application"]
forbidden_modules = [
    "wingman_core.infrastructure", "wingman_core.observability", "wingman_core.web",
    "fastapi", "starlette", "httpx",
]

# ── day1 (same layers as core; only wingman_day1.main composes adapters) ─────

[[tool.importlinter.contracts]]
name = "day1 domain is pure: no I/O libraries and no outer layers"
type = "forbidden"
source_modules = ["wingman_day1.domain"]
forbidden_modules = [
    "wingman_day1.ports", "wingman_day1.application", "wingman_day1.infrastructure",
    "wingman_day1.api", "wingman_day1.main", "wingman_day1.settings",
    "wingman_core.ports", "wingman_core.application", "wingman_core.infrastructure",
    "wingman_core.observability", "wingman_core.web", "wingman_core.testing",
    "fastapi", "starlette", "httpx", "pydantic_settings", "prometheus_client",
]

[[tool.importlinter.contracts]]
name = "day1 ports depend only on the domain"
type = "forbidden"
source_modules = ["wingman_day1.ports"]
forbidden_modules = [
    "wingman_day1.application", "wingman_day1.infrastructure", "wingman_day1.api",
    "wingman_day1.main", "wingman_core.infrastructure", "wingman_core.web",
    "fastapi", "starlette", "httpx",
]

[[tool.importlinter.contracts]]
name = "day1 application depends only on the domain and ports"
type = "forbidden"
source_modules = ["wingman_day1.application"]
forbidden_modules = [
    "wingman_day1.infrastructure", "wingman_day1.api", "wingman_day1.main",
    "wingman_day1.settings", "wingman_core.infrastructure", "wingman_core.observability",
    "wingman_core.web", "fastapi", "starlette", "httpx",
]

[[tool.importlinter.contracts]]
name = "day1 infrastructure does not depend on the application or the API"
type = "forbidden"
source_modules = ["wingman_day1.infrastructure"]
forbidden_modules = [
    "wingman_day1.application", "wingman_day1.api", "wingman_day1.main",
    "wingman_core.web", "fastapi", "starlette",
]

[[tool.importlinter.contracts]]
name = "day1 API reaches adapters only through the composition root"
type = "forbidden"
source_modules = ["wingman_day1.api"]
forbidden_modules = [
    "wingman_day1.infrastructure", "wingman_day1.main", "wingman_core.infrastructure",
    "httpx",
]
# wingman_core.web.auth verifies tokens with core's SessionTokens; that indirect
# import is core's business. The API itself must not name an adapter.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "wingman_day1 does not import wingman_day2"
type = "forbidden"
source_modules = ["wingman_day1"]
forbidden_modules = ["wingman_day2"]

# ── import-linter: day2 (ADR-0001; wingman_day2.main is the composition root) ─
[[tool.importlinter.contracts]]
name = "day2 domain is pure: no I/O libraries and no outer layers"
type = "forbidden"
source_modules = ["wingman_day2.domain"]
forbidden_modules = [
    "wingman_day2.ports", "wingman_day2.application", "wingman_day2.infrastructure",
    "wingman_day2.api", "wingman_day2.main", "wingman_day2.settings",
    "wingman_core.ports", "wingman_core.application", "wingman_core.infrastructure",
    "wingman_core.observability", "wingman_core.web", "wingman_core.testing",
    "fastapi", "starlette", "httpx", "pydantic_settings", "prometheus_client",
]

[[tool.importlinter.contracts]]
name = "day2 ports depend only on the domains"
type = "forbidden"
source_modules = ["wingman_day2.ports"]
forbidden_modules = [
    "wingman_day2.application", "wingman_day2.infrastructure", "wingman_day2.api",
    "wingman_core.infrastructure", "wingman_core.web", "fastapi", "starlette", "httpx",
]

[[tool.importlinter.contracts]]
name = "day2 application depends only on the domains and ports"
type = "forbidden"
source_modules = ["wingman_day2.application"]
forbidden_modules = [
    "wingman_day2.infrastructure", "wingman_day2.api", "wingman_day2.main",
    "wingman_day2.settings", "wingman_core.infrastructure", "wingman_core.observability",
    "wingman_core.web", "fastapi", "starlette", "httpx",
]

[[tool.importlinter.contracts]]
name = "day2 infrastructure does not depend on the use cases or the web"
type = "forbidden"
source_modules = ["wingman_day2.infrastructure"]
forbidden_modules = [
    "wingman_day2.application", "wingman_day2.api", "wingman_day2.main",
    "wingman_core.web", "fastapi", "starlette",
]

[[tool.importlinter.contracts]]
name = "day2 API reaches adapters only through the composition root"
type = "forbidden"
source_modules = ["wingman_day2.api"]
# Core's auth dependency verifies tokens with an adapter; that indirect path is core's own.
allow_indirect_imports = true
forbidden_modules = ["wingman_day2.infrastructure", "wingman_core.infrastructure", "wingman_day2.main"]

[[tool.importlinter.contracts]]
name = "wingman_day2 does not import wingman_day1"
type = "forbidden"
source_modules = ["wingman_day2"]
forbidden_modules = ["wingman_day1"]
