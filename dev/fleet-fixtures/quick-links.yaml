# Quick Links' fake status checks and ArgoCD counts for DAY1_FAKE_FLEET=true
# (development only, ADR-0052), so the page demos without a network.
#
# checks: the first rule whose `match` is part of a URL answers its check;
# every other URL is up (answered 200). `state` is up, down or unknown, and
# `reason` is what the real probe would say.
#
# argocd: each instance listed has a (fake) token, so its card shows the
# applications' counts; `error` makes the read fail as the real one would.
# An instance is a cluster name (the hub, or an MCE of dev/gitlab-fixtures),
# or the `argocd:` key of a card in the links file.

checks:
  - match: console-openshift-console.apps.ocp4-prep-mce-site2-a
    state: down
    reason: no answer within 3 s
    http_status: null
    latency_ms: null
  - match: openshift-gitops-server-openshift-gitops.apps.ocp4-mce-workflow-test
    state: down
    reason: answered 503
    http_status: 503
    latency_ms: 12
  - match: netbox.example.internal
    state: unknown
    reason: TLS certificate not trusted
    http_status: null
    latency_ms: null
  - match: grafana.example.internal
    state: up
    reason: answered 302
    http_status: 302
    latency_ms: 95

argocd:
  hub-dev: {synced: 42, out_of_sync: 3, healthy: 40, progressing: 1, degraded: 2, missing: 1}
  ocp4-prod-mce-site1-a: {synced: 118, out_of_sync: 0, healthy: 118}
  ocp4-prep-mce-site1-a: {synced: 61, out_of_sync: 4, healthy: 59, progressing: 3, degraded: 1}
  ocp4-prod-mce-site2-a: {error: ArgoCD refused the token (401)}
  main: {synced: 27, out_of_sync: 1, healthy: 26, degraded: 1}
