<!DOCTYPE html>

  <title>{{slug}} Diagram</title>
  <!-- The fake server-scan's diagram (DAY1_FAKE_FLEET, development only):

  <style>
    :root { --bg: #ffffff; --text: #0f172a; --muted: #64748b; --box: #f1f5f9; --line: #94a3b8; --accent: #0891b2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #020617; --text: #f8fafc; --muted: #94a3b8; --box: #0f172a; --line: #475569; --accent: #22d3ee; }
    }
    body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); font: 14px ui-monospace, monospace; }
    h1 { margin: 0 0 4px; font-size: 18px; }
    p { margin: 0 0 24px; color: var(--muted); }
    svg { width: 100%; max-width: 960px; }
    rect { fill: var(--box); stroke: var(--accent); stroke-width: 1.5; }
    text { fill: var(--text); font: 13px ui-monospace, monospace; }
    path { stroke: var(--line); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    marker path { fill: var(--line); stroke: none; }
  </style>
</head>
