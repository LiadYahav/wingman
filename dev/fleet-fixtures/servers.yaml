# A made-up server-scan fleet for DAY1_FAKE_FLEET=true (development only, ADR-0038).
#
# `items` has the exact shape of server-scan's `GET /api/v1/servers/rows`
# items, and day1 reads it with the same parser as the real answer
# (wingman_day1.infrastructure.server_scan.server_row). Nothing here is real:
# the ids, serials and MACs are invented, and the BMC addresses are in the
# documentation range 192.0.2.0/24.
#
# `cluster_name` is what server-scan's nodes-status jobs write: the
# HostedCluster (ocp4-<clusterName>, the file stem with the default
# DAY1_CLUSTER_NAME_STRIP_PREFIX) or the bare clusterName. Both mean the same
# cluster; one lark node uses the bare name to show it.
#
# `runs` seeds uninstall runs that stay as they are (the fake's own runs walk
# a few sample phases and then free the server).
#
# The fake MCE in mce.yaml places these servers in NodePools; the two files
# tell one story.

x-free: &free {held: false, holder: null, mce_cluster: null, infra_env: null, expires_at: null}
x-no-maintenance: &no-maintenance {enabled: false, reason: null, created_by: null}

