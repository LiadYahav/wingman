# A made-up segments-manager ledger for DAY1_FAKE_FLEET=true (development only, ADR-0039).
#
# `items` has the exact shape of segments-manager's
# `GET /api/segments/by-segment?segment=<cidr>` answer, and day1 reads it with
# the same parser as the real answer
# (wingman_day1.infrastructure.segments_manager.segment_record). Nothing here is
# real: the ids, VLANs and EPG names are invented.
#
# Every segment is a /24, and an allocated one's `cluster_name` is the cluster
# file's stem (what allocate-segment gives segments-manager). The clusters in
# dev/gitlab-fixtures that have `vlanId` and `dhcp_values.network` hold the
# segments below, and the two files agree, except on purpose for one:
#
# - ocp4-prod-herzi-site1: segments-manager has VLAN 1418 for 10.20.44.0/24,
#   the file has 1410. The cluster page shows the file's VLAN and a warning.
#
# Two segments are Available (the free pool): nothing holds them.

items:
  # ── site1 ──────────────────────────────────────────────────────────────────
  - _id: 6720f0000000000000000142
    type: HC
    site: site1
    vlan_id: 1408
    epg_name: EPG_site1_HC_1408
    segment: 10.20.42.0/24
    dhcp: true
    cluster_name: ocp4-prep-eyal-site1
    allocated_at: "2026-10-02T09:12:40+00:00"
    status: Allocated
  - _id: 6720f0000000000000000143
    type: HC
