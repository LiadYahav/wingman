# A made-up segments-manager ledger for DAY1_FAKE_FLEET=true (development only,
# ADR-0039, ADR-0047).
#
# `items` has the exact shape of segments-manager's answers
# (`GET /api/segments`, and `GET /api/segments/by-segment?segment=<cidr>` for
# one), and day1 reads it with the same parser as the real answers
# (wingman_day1.infrastructure.segments_manager_parse.segment_record). Nothing
# here is real: the ids, VLANs, EPG names and holders are invented.
#
# `sites` is segments-manager's `SITE_NETWORKS` keys: the fake answers
# `GET /api/sites` with it, and `GET /api/stats` with one entry per site,
# counted from `items`. site3 has no segments yet, so its card shows 0 / 0.
#
# Every segment is a /24, and an allocated one's `cluster_name` is the cluster
# file's stem (what allocate-segment gives segments-manager). The clusters in
# dev/gitlab-fixtures that have `vlanId` and `dhcp_values.network` hold the HC
# segments below, and the two files agree, except on purpose for one:
#
# - ocp4-prod-herzi-site1: segments-manager has VLAN 1418 for 10.20.44.0/24,
#   the file has 1410. The cluster page and the Segments area show a warning.
#
# The others cover what segments-manager records besides hosted clusters:
# every type (MCE and INVENTORY held by an MCE, PXE, HUB, and a UPI segment two
# UPI clusters share, so its `cluster_name` is a list), an HC held by a name
# day1 has no file for, `dhcp: false`, Available segments that still carry the
# `allocated_at` of their last allocation (segments-manager never clears it),
# and one record with the legacy keys live records still have, all null.

sites: [site1, site2, site3]

items:
  # ── site1 ──────────────────────────────────────────────────────────────────
  - _id: 6720f0000000000000000142
    type: HC
    site: site1
    vlan_id: 1408
    epg_name: EPG_site1_HC_1408
    segment: 10.20.42.0/24
    dhcp: true
    cluster_name: ocp4-prep-eyal-site1
    allocated_at: "2026-10-02T09:12:40+00:00"
    status: Allocated
  - _id: 6720f0000000000000000143
