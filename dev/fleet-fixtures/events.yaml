# Made-up audit events for DAY1_FAKE_FLEET=true (development only, ADR-0048's
# 3.31.0 amendment): the Events page, and a server's History.
#
# The fake's audit trail is every server's History (made from its row in
# servers.yaml, by fake_server_records) plus these: what people did, what
# the platform did on its own, herzi's install lock, and a server since
# pruned. Together about 100 events, so the Events page has two pages.
#
# Each item is one of server-scan's `AuditEventResponse`s without its id:
# `server` names a server of servers.yaml (its id and current name are
# filled in); `server_id` alone is a server server-scan no longer lists,
# whose name is gone. `data` is what server-scan's writer records for the
# type (team-redbull/server-scan at 92146d3). Times are UTC. Nothing here is
# real: the people, jobs and tickets are invented.

items:
  # ── People ───────────────────────────────────────────────────────────────
  - event_type: LOGIN_SUCCEEDED
    created_at: "2026-11-14T07:58:00Z"
    actor: {type: USER, id: alice, display: Alice Cohen}
    request_id: req-0001
    data: {user: alice, role: ADMIN}
  - event_type: TOKEN_CREATED
    created_at: "2026-11-14T08:02:00Z"
    actor: {type: USER, id: alice, display: Alice Cohen}
