# Inventory Management's demo for DAY1_FAKE_FLEET=true (development only, ADR-0057).
#
# `items` adds servers to servers.yaml's fake server-scan fleet, in the exact
# row shape of server-scan's `GET /api/v1/servers/rows` (read with the same
# parser). They are AVAILABLE: in no MCE yet, so nothing else in the demo
# (the Nodes tab, placement) sees them. Nothing here is real: the ids,
# serials and MACs are invented, and the BMC addresses are in the
# documentation range 192.0.2.0/24.
#
# - dell-r760-site1-64c-512gb-20tb: three servers for the fake herzi's pool
#   (ocp4-prod-lark-site1's short NodePool on ocp4-prod-mce-site1-a).
# - dell-r650-site1-96c-768gb: one a named install may pick, one locked by
#   another add-server run, one in maintenance (a donor).
# - hp-gen12-site1-64c-512gb: one in WARNING health (shown, still offered).
#
# `phases` are a sample of the real workflow's steps, each `phase_seconds`
# long; day1 passes the real ones through and keeps no list of them.
#
# `herzi`: the fake herzi starts a pool draw on that pool `first_after`
# seconds after start-up, then every `every_seconds`; after a run of its finds
# no server, it waits `probe_seconds` (herzi's probe mode).
#
# `runs`: past runs, kept as they are. `pool: [mce, infra_env, slot]` or
# `named: [mce, server]`; `minutes_ago` is when it started.

phases: [validating-infraenv, acquiring-server, reserving-server, registering-bmh, waiting-for-agent]
phase_seconds: 8

herzi:
  mce: ocp4-prod-mce-site1-a
  infra_env: dell-r760-site1-64c-512gb-20tb
  first_after_seconds: 15
  every_seconds: 90
  probe_seconds: 600

runs:
  - pool: [ocp4-prod-mce-site1-a, dell-r650-site1-96c-768gb, 1]
    status: COMPLETED
    phase: completed
    server: ocp-dell-r650-site1-96c-768gb-DLFAKE0701
    minutes_ago: 190
  - named: [ocp4-prod-mce-site1-b, ocp-dell-r650-site1-96c-768gb-DLFAKE0812]
    status: FAILED
    phase: reserving-server
    error: "ServerReservedError: ocp-dell-r650-site1-96c-768gb-DLFAKE0812 is held by another add-server-to-mce run (fake)"
    minutes_ago: 40

x-free: &free {held: false, holder: null, mce_cluster: null, infra_env: null, expires_at: null}
x-no-maintenance: &no-maintenance {enabled: false, reason: null, created_by: null}

