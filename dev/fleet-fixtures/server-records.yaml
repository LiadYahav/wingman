# The made-up hardware behind servers.yaml, for DAY1_FAKE_FLEET=true
# (development only): the Server Scan area's server page (ADR-0048's 3.25.0
# amendment, docs/notes/2026-11-13-server-scan-area-api.md §9.7).
#
# A server's record is its row in servers.yaml plus, here:
#   - `models`: the hardware of its model, in server-scan's own shape
#     (`hardware` of `GET /api/v1/servers/{id}`), its NICs (named in order
#     for the row's MACs), the NICs' OS names, its fabric uplinks (Cisco) and
#     its manager. `{serial}` is replaced by the server's serial. The CPU's
#     cores and the memory's total come from the server's name
#     (`-128c-1024gb-`) when it has them.
#   - `rules`: the classification rule that matched each installation type.
#   - `servers`: what differs for one server: its health per category and
#     why, the fields the last collection could not read, an unreachable BMC.
#
# Nothing here is real: the models' parts, serials and MACs are invented.

rules:
  HOSTED_CLUSTER: {id: rule-hc, name: Hosted cluster nodes, field: name, pattern: "^ocp-[a-z]+-[a-z0-9]+-site"}
  MCE: {id: rule-mce, name: MCE nodes, field: name, pattern: "^mce-"}
  UPI: {id: rule-upi, name: UPI nodes, field: name, pattern: "^upi-"}

