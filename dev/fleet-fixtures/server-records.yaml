servers:
  ocp-dell-r660-site1-128c-1024gb-DLFAKE0102:
    health:
      memory: WARNING
    reasons:
      - {policy_key: memory.correctable_errors, policy_name: Correctable memory errors, category: memory, severity: WARNING, message: "DIMM B3 reports correctable ECC errors (12 in 24 h)"}
  ocp-dell-r760-site1-64c-512gb-DLFAKE0104:
    unread_fields: [hardware.storage.drives, hardware.power.psus]
  ocp-hp-gen11-site1-64c-512gb-HPFAKE0202:
    health:
      storage: MAJOR
    reasons:
      - {policy_key: storage.predictive_failure, policy_name: Drive predicts failure, category: storage, severity: MAJOR, message: "Drive 1I:1:2 predicts a failure (SMART)"}
  ocp-cisco-m6-site1-128c-512gb-CSFAKE0302:
    health:
      connectivity: CRITICAL
    reasons:
      - {policy_key: connectivity.fabric_paths_down, policy_name: Fabric paths down, category: connectivity, severity: CRITICAL, message: "0 of 2 fabric paths up"}
    uplinks_down: true
    unreachable_reason: timeout
    unread_fields: [hardware.memory.total_bytes, hardware.power.psus, network.interfaces]
  ocp-dell-r660-site2-64c-256gb-DLFAKE0402:
    unevaluated: true
    unread_fields: [hardware.cpu.model, hardware.storage.total_bytes, hardware.gpus]
