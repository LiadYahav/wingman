# The fake MCE hubs for DAY1_FAKE_FLEET=true (development only, ADR-0038).
#
# Each cluster here becomes a HostedCluster with its NodePools, MachineSets,
# Machines, AgentMachines and Agents, built in the Kubernetes shape the MCE
# serves and read with the real adapter's parsers
# (wingman_day1.infrastructure.fake_mce). Servers are the made-up ones in
# servers.yaml: an Agent's agent-install.openshift.io/bmh label is its
# server's name, lowercased as a Kubernetes name is.
#
# `name` is the cluster file stem; the HostedCluster, its namespaces and the
# NodePool names (<clusterName>-<infra_env>) follow the deployment's
# DAY1_CLUSTER_NAME_STRIP_PREFIX. A node's `as` is what its Machine is doing:
# ready (the default), rebooting, waiting (no Agent reserved), installing,
# deleting. A Replace pool's node names the MachineSet `revision` it is from.
# `spare_agents` are Agents in the agent namespace that no Machine of the
# cluster took: `bound` (left behind, still labelled) or `unapproved`.
#
# Versions follow each cluster file's mastertag in dev/gitlab-fixtures, as
# ArgoCD (auto-sync) would make them: a HostedCluster runs its file's version,
# and a pool still updating to it shows the version it last finished.

agent_namespace: inventory

# Each MCE hub's own nodes and free Agents, for MCE placement (ADR-0050).
#
# `nodes`: `pods` is how many pods that are not Succeeded or Failed run on the
# node (each hub also has one Pending pod bound to no node, which counts
# nowhere); `allocatable` is its pod limit (250 when not given). A node is a
# worker unless `role: control-plane` or `role: infra`; `ready: false`,
# `cordoned: true` and `tainted: true` (a NoSchedule taint) take it out of the
# count too. Only workers count.
#
# `free_agents`: Agents in an InfraEnv (the node type) that no cluster took,
# approved and validated; each is a server in servers.yaml, whose health
# decides whether it counts. An MCE listed nowhere in this file cannot be
# read, so it is never picked.
#
# site1 prod has three candidates: -a (the six fixture clusters, 150 free
# pods, two healthy Dell R650 and one HP Gen12 free), -b (no cluster, 400
# free, a worker cordoned, three infra nodes; one healthy Dell, the other in
# maintenance, and two HP free) and -c (no cluster, 40 free, a worker not
# ready; it hosts 4.16 and 4.17 only). Before any nodepool names a type the
# form picks -b; two dell-r650-site1-96c-768gb move the pick to -a (-b is one
# healthy Dell short), two hp-gen12-site1-64c-512gb keep -b (-a is one short).
# No fixture cluster uses these two types, so the nodes view is unchanged.
hubs:
  ocp4-prod-mce-site1-a:
    nodes:
      - {name: master-0, role: control-plane, pods: 120}
      - {name: master-1, role: control-plane, pods: 118}
      - {name: master-2, role: control-plane, pods: 121}
      - {name: worker-0, pods: 200}
      - {name: worker-1, pods: 190}
      - {name: worker-2, pods: 210}
    free_agents:
      - {server: ocp-dell-r650-site1-96c-768gb-DLFAKE0701, infra_env: dell-r650-site1-96c-768gb}
      - {server: ocp-dell-r650-site1-96c-768gb-DLFAKE0702, infra_env: dell-r650-site1-96c-768gb}
      - {server: ocp-hp-gen12-site1-64c-512gb-HPFAKE0703, infra_env: hp-gen12-site1-64c-512gb}
  ocp4-prod-mce-site1-b:
    nodes:
      - {name: master-0, role: control-plane, pods: 95}
      - {name: master-1, role: control-plane, pods: 97}
      - {name: master-2, role: control-plane, pods: 96}
      - {name: worker-0, pods: 60}
      - {name: worker-1, pods: 40}
      - {name: worker-2, pods: 12, cordoned: true}
      - {name: infra-0, role: infra, pods: 30}
      - {name: infra-1, role: infra, pods: 31}
      - {name: infra-2, role: infra, pods: 29}
    free_agents:
      - {server: ocp-dell-r650-site1-96c-768gb-DLFAKE0601, infra_env: dell-r650-site1-96c-768gb}
      - {server: ocp-dell-r650-site1-96c-768gb-DLFAKE0602, infra_env: dell-r650-site1-96c-768gb}
      - {server: ocp-hp-gen12-site1-64c-512gb-HPFAKE0603, infra_env: hp-gen12-site1-64c-512gb}
      - {server: ocp-hp-gen12-site1-64c-512gb-HPFAKE0604, infra_env: hp-gen12-site1-64c-512gb}
  ocp4-prod-mce-site1-c:
    nodes:
      - {name: master-0, role: control-plane, pods: 101}
      - {name: master-1, role: control-plane, pods: 99}
      - {name: master-2, role: control-plane, pods: 100}
      - {name: worker-0, pods: 210}
      - {name: worker-1, pods: 0, ready: false}
  ocp4-prep-mce-site1-a:
    nodes:
      - {name: master-0, role: control-plane, pods: 110}
      - {name: master-1, role: control-plane, pods: 108}
      - {name: master-2, role: control-plane, pods: 109}
      - {name: worker-0, pods: 150}
      - {name: worker-1, pods: 160}
  ocp4-prod-mce-site2-a:
    nodes:
      - {name: master-0, role: control-plane, pods: 90}
      - {name: master-1, role: control-plane, pods: 92}
      - {name: master-2, role: control-plane, pods: 91}
      - {name: worker-0, pods: 80}
      - {name: worker-1, pods: 75}
  ocp4-prep-mce-site2-a:
    nodes:
      - {name: master-0, role: control-plane, pods: 105}
      - {name: master-1, role: control-plane, pods: 104}
      - {name: master-2, role: control-plane, pods: 106}
      - {name: worker-0, pods: 170}
      - {name: worker-1, pods: 160}

clusters:
  # Git moved the cluster to 4.18.22: the control plane is there, and one
  # pool's workers are updating in place (one of three done, one rebooting).
  # Also a pool short a node, and a server server-scan still places in the
  # cluster that no Machine leads to (0105).
  - name: ocp4-prod-lark-site1
    mce: ocp4-prod-mce-site1-a
    version: 4.18.22
    node_pools:
      - infra_env: dell-r660-site1-128c-1024gb-5tb
        upgrade: InPlace
        replicas: 3
        version: 4.18.20
        updating: {kind: version, target: 4.18.22, upgraded: 1}
        nodes:
          - {server: ocp-dell-r660-site1-128c-1024gb-DLFAKE0101}
          - {server: ocp-dell-r660-site1-128c-1024gb-DLFAKE0102, as: rebooting}
          - {server: ocp-dell-r660-site1-128c-1024gb-DLFAKE0103}
      - infra_env: dell-r760-site1-64c-512gb-20tb
        upgrade: Replace
        replicas: 2
        version: 4.18.22
        nodes:
          - {server: ocp-dell-r760-site1-64c-512gb-DLFAKE0104}
          - {as: waiting}
    spare_agents:
      - {server: ocp-dell-r760-site1-64c-512gb-DLFAKE0105, infra_env: dell-r760-site1-64c-512gb-20tb, as: bound}
      - {server: ocp-dell-r760-site1-64c-512gb-DLFAKE0106, infra_env: dell-r760-site1-64c-512gb-20tb, as: unapproved}

  # A config change merged in Git rolls out by replacing Machines: the old
  # revision's Machine drains, the new one installs. Version as in Git.
  - name: ocp4-prod-herzi-site1
    mce: ocp4-prod-mce-site1-a
    version: 4.16.27
    node_pools:
      - infra_env: hp-gen11-site1-64c-512gb
        upgrade: Replace
        replicas: 3
        version: 4.16.27
        updating: {kind: config, target: 5c2e1f0a}
        nodes:
          - {server: ocp-hp-gen11-site1-64c-512gb-HPFAKE0201, revision: 1}
          - {server: ocp-hp-gen11-site1-64c-512gb-HPFAKE0203, revision: 1}
          - {server: ocp-hp-gen11-site1-64c-512gb-HPFAKE0202, revision: 1, as: deleting}
          - {server: ocp-hp-gen11-site1-64c-512gb-HPFAKE0204, revision: 2, as: installing}

  # Simple and ready.
  - name: ocp4-prod-hawk-site1
    mce: ocp4-prod-mce-site1-a
    version: 4.18.22
    node_pools:
      - infra_env: cisco-m6-site1-128c-512gb
        upgrade: Replace
        replicas: 2
        version: 4.18.22
        nodes:
          - {server: ocp-cisco-m6-site1-128c-512gb-CSFAKE0301, revision: 1}
          - {server: ocp-cisco-m6-site1-128c-512gb-CSFAKE0302, revision: 1}
  - name: ocp4-prep-amit-site2-a
    mce: ocp4-prep-mce-site2-a
    version: 4.16.27
    node_pools:
      - infra_env: dell-r660-site2-64c-256gb
        upgrade: InPlace
        replicas: 2
        version: 4.16.27
        nodes:
          - {server: ocp-dell-r660-site2-64c-256gb-DLFAKE0401}
          - {server: ocp-dell-r660-site2-64c-256gb-DLFAKE0402}

  # The other fixture clusters: on their MCE, with no NodePools.
  - {name: ocp4-prod-heron-site1, mce: ocp4-prod-mce-site1-a, version: 4.18.22}
  - {name: ocp4-prod-karniol-site1, mce: ocp4-prod-mce-site1-a, version: 4.16.27}
  - {name: ocp4-prod-owl-site1, mce: ocp4-prod-mce-site1-a, version: 4.18.22}
  - {name: ocp4-prep-eyal-site1, mce: ocp4-prep-mce-site1-a, version: 4.20.9}
  - {name: ocp4-prep-itay-site1, mce: ocp4-prep-mce-site1-a, version: 4.20.9}
  - {name: ocp4-upgrade-demo, mce: ocp4-mce-workflow-test, version: 4.21.40}
  - {name: ocp4-prep-ilay-site2-a, mce: ocp4-prep-mce-site2-a, version: 4.16.27}
  - {name: ocp4-prep-kite-site2, mce: ocp4-prep-mce-site2-a, version: 4.19.10}
  - {name: ocp4-prep-wren-site2, mce: ocp4-prep-mce-site2-a, version: 4.19.10}
  - {name: ocp4-prod-didush-site2-a, mce: ocp4-prod-mce-site2-a, version: 4.16.27}
