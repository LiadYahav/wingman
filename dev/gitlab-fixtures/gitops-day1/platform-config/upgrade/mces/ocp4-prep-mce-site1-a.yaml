# yaml-language-server: $schema=../schema/mce.schema.json
#
# MCE ocp4-prep-mce-site1-a (sites/site1/mces/ocp4-prep-mce-site1-a/).
# supportedHostedVersions must equal the hypershift/supported-versions
# ConfigMap on that MCE. Wingman's create form offers the ladder's rungs in
# these minors, and nothing else (upgrade/README.md). A newer MCE than
# production's, so it hosts newer minors.
mce:
  version: 2.10.1
  supportedHostedVersions: ["4.21", "4.20", "4.19", "4.18", "4.17"]

# Pre-production: two hosted control planes may upgrade together.
maxConcurrentControlPlanes: 2
