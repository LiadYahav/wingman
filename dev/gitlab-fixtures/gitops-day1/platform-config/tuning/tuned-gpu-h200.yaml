# Example profile for Wingman's tests and local runs: the Hopper H200 workers'
# Tuned, built on the profile performance-gpu-h200 generates, so a nodepool
# that names it names performance-gpu-h200 too. The values are placeholders.
apiVersion: tuned.openshift.io/v1
kind: Tuned
metadata:
  name: tuned-gpu-h200
spec:
  profile:
  - name: tuned-gpu-h200
    data: |
      [main]
      summary=Hopper H200 workers: no NUMA balancing, memory kept resident
      include=openshift-node-performance-performance-gpu-h200
      [sysctl]
      kernel.numa_balancing=0
      vm.swappiness=1
      vm.zone_reclaim_mode=0
  recommend:
  - priority: 18
    profile: tuned-gpu-h200
