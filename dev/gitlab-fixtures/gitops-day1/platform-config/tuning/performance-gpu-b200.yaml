# Example profile for Wingman's tests and local runs: a GPU worker of the
# Blackwell B200 (HGX, 8 GPUs) class. The CPU sets and page counts are placeholders, not
# measured on any real server; copy the shape, size it for your hardware.
# A PerformanceProfile changes kernel arguments: applying it reboots the nodes.
apiVersion: performance.openshift.io/v2
kind: PerformanceProfile
metadata:
  name: performance-gpu-b200
spec:
  cpu:
    reserved: "0-3,64-67"
    isolated: "4-63,68-127"
  hugepages:
    defaultHugepagesSize: 1G
    pages:
    - count: 128
      size: 1G
  numa:
    topologyPolicy: single-numa-node
  realTimeKernel:
    enabled: false
  workloadHints:
    realTime: false
    highPowerConsumption: true
    perPodPowerManagement: false
  additionalKernelArgs:
  - iommu=pt
  nodeSelector:
    node-role.kubernetes.io/worker: ""
