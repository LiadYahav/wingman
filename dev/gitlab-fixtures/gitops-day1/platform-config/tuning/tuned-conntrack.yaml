# Example profile for Wingman's tests and local runs: a larger connection-
# tracking table for nodes that carry many short connections (ingress,
# inference endpoints). The values are placeholders; size them for your load.
apiVersion: tuned.openshift.io/v1
kind: Tuned
metadata:
  name: tuned-conntrack
spec:
  profile:
  - name: tuned-conntrack
    data: |
      [main]
      summary=A larger connection-tracking table, with shorter idle timeouts
      include=openshift-node
      [sysctl]
      net.netfilter.nf_conntrack_max=1048576
      net.netfilter.nf_conntrack_tcp_timeout_established=86400
      net.netfilter.nf_conntrack_tcp_timeout_time_wait=30
  recommend:
  - priority: 25
    profile: tuned-conntrack
