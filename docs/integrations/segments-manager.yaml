# Which segments-manager files each Wingman file follows, and the
# segments-manager commit Wingman matches. Read by scripts/upstream_diff.py;
# the guide is docs/integrations/segments-manager.md. A path that ends in /
# is a folder. tests/repo/test_integrations_map.py keeps it true: every
# wingman path exists, and a file is listed here exactly when it names this map.
#
# Wingman's Segments area was removed in 3.52.1 (ADR-0066). What is left reads one segment (by-segment, ADR-0039) and
# links to segments-manager's UI and its search.

upstream: team-redbull/segments-manager
# a4edc12 (2026-10-11) is main's head since that day, the commit
# docs/ecosystem/notes/segments-manager.md read, and the build released as
# image v0.1.15 (team-redbull/redbull-platform's segments-manager/v0.1.15).
synced_at: a4edc12
# segments-manager's own tags stopped at v1.0.23 (2026-06-10), an ancestor
# of a4edc12; its releases are tagged in redbull-platform. So the target is
# its main branch, not its newest tag.
default_target: main

# What Wingman reads: by-segment and search, the record's shape, its status
# and type values, and the cache in front of them. Every path here is
# followed below or matters on its own (constants.py: the "Allocated" the
# network check compares with), so nothing is listed as not followed; the
# writes, the logs, the exports and the UI are not watched.
watch:
  - src/api/routes.py
  - src/models/schemas.py
  - src/config/constants.py
  - src/services/segment_service.py
  - src/database/cache.py

files:
  - wingman: apps/day1-service/src/wingman_day1/integrations/segments_manager/domain/links.py
    upstream:
      - src/api/routes.py
      - static/js/app.js
    note: the search route, and a UI that reads no URL parameters
  - wingman: apps/day1-service/src/wingman_day1/integrations/segments_manager/infrastructure/adapter.py
    upstream: [src/api/routes.py]
    note: GET /api/segments/by-segment and its 404
  - wingman: apps/day1-service/src/wingman_day1/integrations/segments_manager/infrastructure/parse.py
    upstream:
      - src/models/schemas.py
      - src/api/routes.py
      - src/services/segment_service.py
  - wingman: apps/day1-service/src/wingman_day1/integrations/segments_manager/infrastructure/fake.py
    upstream: [src/api/routes.py]
    note: by-segment's answer, one record or none
  - wingman: apps/day1-service/src/wingman_day1/integrations/segments_manager/infrastructure/cached.py
    upstream: [src/database/cache.py]
    note: segments-manager's own cache, under Wingman's TTL
  - wingman: dev/fleet-fixtures/segments.yaml
    upstream: [src/models/schemas.py]
