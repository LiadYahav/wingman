# Which segments-manager files each Wingman file follows, and the
# segments-manager commit Wingman matches. Read by scripts/upstream_diff.py;
# the guide is docs/integrations/segments-manager.md. A path that ends in /
# is a folder. tests/repo/test_integrations_map.py keeps it true: every
# wingman path exists, and a file is listed here exactly when it names this map.

upstream: team-redbull/segments-manager
# a4edc12 (2026-10-11) is main's head since that day, the commit
# docs/ecosystem/notes/segments-manager.md read, and the build released as
# image v0.1.15 (team-redbull/redbull-platform's segments-manager/v0.1.15).
# The Segments area (ADR-0047, 3.15.0 to 3.21.0) was built after it and
# follows its last two changes: a UPI segment's list of clusters, and the
# site cards' types above zero (32cc7b9).
synced_at: a4edc12
# segments-manager's own tags stopped at v1.0.23 (2026-06-10), an ancestor
# of a4edc12; its releases are tagged in redbull-platform. So the target is
# its main branch, not its newest tag.
default_target: main

# What Wingman reads or rebuilds: its open GETs, their shapes, the counts and
# filters behind them, and its page.
watch:
  - src/api/
  - src/models/
  - src/config/constants.py
  - src/config/settings.py
  - src/services/
  - src/utils/database/
  - src/database/cache.py
  - static/

# Under watch, and deliberately not followed.
not_followed:
  - upstream:
      - src/services/allocation_service.py
      - src/utils/database/allocation_utils.py
      - src/utils/database/segment_crud.py
    why: >-
      allocation, release and edits are the workflows' (allocate-segment and its
      release); Wingman never writes to segments-manager
  - upstream:
      - src/services/logs_service.py
    why: its raw application log (the logs routes); Wingman never shows it (ADR-0047)
  - upstream:
      - src/api/__init__.py
      - src/services/__init__.py
      - src/utils/database/__init__.py
    why: package files, no behaviour Wingman reads

files:
  # ── day1: segments-manager's answers, typed (it publishes no schema) ─────
  - wingman: apps/day1-service/src/wingman_day1/integrations/segments_manager/domain/segments.py
    upstream:
      - src/models/schemas.py
      - src/config/constants.py
  - wingman: apps/day1-service/src/wingman_day1/integrations/segments_manager/domain/links.py
    upstream:
      - src/api/routes.py
      - static/js/app.js
  - wingman: apps/day1-service/src/wingman_day1/integrations/segments_manager/infrastructure/adapter.py
    upstream:
      - src/api/routes.py
      - src/database/cache.py
  - wingman: apps/day1-service/src/wingman_day1/integrations/segments_manager/infrastructure/parse.py
    upstream:
      - src/models/schemas.py
      - src/api/routes.py
      - src/services/segment_service.py
      - src/services/stats_service.py
  - wingman: apps/day1-service/src/wingman_day1/integrations/segments_manager/infrastructure/fake.py
    upstream:
      - src/config/settings.py
      - src/services/segment_service.py
      - src/services/stats_service.py
      - src/utils/database/segment_queries.py
      - src/utils/database/statistics_utils.py
  - wingman: apps/day1-service/src/wingman_day1/integrations/segments_manager/infrastructure/cached.py
    upstream: [src/database/cache.py]
    note: the Refresh button's fresh=true
  - wingman: apps/day1-service/src/wingman_day1/integrations/segments_manager/api/segments_schemas.py
    upstream: [src/models/schemas.py]
  - wingman: apps/day1-service/tests/integrations/segments_manager/unit/infrastructure/test_segments_manager_reads.py
    upstream:
      - src/api/routes.py
      - src/models/schemas.py
  - wingman: dev/fleet-fixtures/segments.yaml
    upstream: [src/models/schemas.py]
