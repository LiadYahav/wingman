# Which server-scan files each Wingman file follows, and the server-scan
# version Wingman matches. Read by scripts/upstream_diff.py; the guide is
# docs/integrations/server-scan.md. A path that ends in / is a folder.
# tests/repo/test_integrations_map.py keeps it true: every wingman path
# exists, and a file is listed here exactly when it names this map.
#
# Wingman's Server Scan area was removed in 3.52.1 (ADR-0066). What is left reads two routes: the fleet rows and one server.

upstream: team-redbull/server-scan
# v6.6.0 is 635e08a; Wingman was matched to v5.3.0 (92146d3), brought to
# v6.1.0 (876dd16) in 3.43.0 (ADR-0048's 2026-11-16 amendment) and to v6.6.0
# in 3.48.0 (its 2026-11-18 amendment).
synced_at: v6.6.0

# What Wingman reads: the two routes, their shapes and the values in them.
# Every path here is followed below, so nothing is listed as not followed;
# the rest of server-scan (its other routes, writes, reservations, login and
# UI) is not watched.
watch:
  - backend/app/api/v1/servers.py
  - backend/app/api/v1/schemas.py
  - backend/app/domain/enums/
  - backend/app/domain/models/openshift.py

files:
  - wingman: apps/day1-service/src/wingman_day1/integrations/server_scan/infrastructure/adapter.py
    upstream: [backend/app/api/v1/servers.py]
    note: GET /servers/rows (its weak ETag and 304) and GET /servers/{id}
  - wingman: apps/day1-service/src/wingman_day1/integrations/server_scan/infrastructure/parse.py
    upstream:
      - backend/app/api/v1/schemas.py
      - backend/app/domain/enums/
      - backend/app/domain/models/openshift.py
    note: ServerRowsResponse and ServerDetail's openshift.cluster_name
