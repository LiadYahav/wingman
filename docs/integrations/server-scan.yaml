# Which server-scan files each Wingman file follows, and the server-scan
# version Wingman matches. Read by scripts/upstream_diff.py; the guide is
# docs/integrations/server-scan.md. A path that ends in / is a folder.
# tests/repo/test_integrations_map.py keeps it true: every wingman path
# exists, and a file is listed here exactly when it names this map.

upstream: team-redbull/server-scan
# v6.6.0 is 635e08a; Wingman was matched to v5.3.0 (92146d3), brought to
# v6.1.0 (876dd16) in 3.43.0 (ADR-0048's 2026-11-16 amendment) and to v6.6.0
# in 3.48.0 (its 2026-11-18 amendment).
synced_at: v6.6.0

# What Wingman reads or ports: a change here matters even when no entry
# below follows the file (a new route, schema, enum or page).
watch:
  - backend/app/api/v1/
  - backend/app/domain/enums/
  - backend/app/domain/models/
  - frontend/src/
  - frontend/public/architecture/
  - frontend/public/icons/app-icon.svg
  - .claude/skills/server-scan-api/

# Under watch, and deliberately not followed.
not_followed:
  - upstream:
      - backend/app/api/v1/reservation_schemas.py
    why: >-
      the reservations and /servers/available are the workflows' calls (herzi's,
      add-server-to-mce's); Wingman shows a reservation only as a server's record
      carries it
  - upstream:
      - backend/app/api/v1/auth.py
      - backend/app/api/v1/auth_schemas.py
      - backend/app/api/v1/tokens.py
      - backend/app/api/v1/token_schemas.py
      - backend/app/api/v1/__init__.py
      - backend/app/domain/models/api_token.py
      - frontend/src/api/auth.ts
      - frontend/src/api/personalToken.ts
      - frontend/src/features/auth/
      - frontend/src/features/skill/TokenSection.tsx
      - frontend/src/components/AdminGate.tsx
      - frontend/src/components/AuditGate.tsx
    why: >-
      server-scan's own login, roles and personal tokens: Wingman signs people in
      itself and reaches server-scan with its shared tokens; a personal token is
      made on server-scan's own Claude page
  - upstream:
      - frontend/src/api/client.ts
      - frontend/src/api/queryKeys.ts
      - frontend/src/api/platform.ts
      - frontend/src/api/healthMetrics.ts
      - frontend/src/features/classification/hooks.ts
      - frontend/src/features/confs/hooks.ts
      - frontend/src/features/events/hooks.ts
      - frontend/src/features/health/hooks.ts
      - frontend/src/features/inventory/hooks.ts
      - frontend/src/features/servers/hooks.ts
      - frontend/src/features/sites/hooks.ts
      - frontend/src/lib/query-client.ts
      - frontend/src/lib/toast.ts
      - frontend/src/lib/clipboard.ts
      - frontend/src/lib/useDebouncedValue.ts
      - frontend/src/components/AppLayout.tsx
      - frontend/src/components/AppFooter.tsx
      - frontend/src/components/CopyButton.tsx
      - frontend/src/components/RouteErrorBoundary.tsx
      - frontend/src/components/Toaster.tsx
      - frontend/src/routes/
      - frontend/src/test/
      - frontend/src/main.tsx
      - frontend/src/router.tsx
      - frontend/src/assets/
      - frontend/src/vite-env.d.ts
    why: >-
      server-scan's own shell and data layer: Wingman reads day1's routes with
      its own hooks (features/server-scan/api/), in its own layout and design
  - upstream:
      - frontend/src/features/inventory/InventoryPage.test.tsx
      - frontend/src/features/inventory/MaintenanceToggle.test.tsx
    why: >-
      server-scan's render tests of its Servers page and its maintenance toggle,
      through its own hooks, router and DOM; Wingman holds the page with its e2e
      specs (apps/web/e2e/tests/server-scan-servers.spec.ts), and the pure rules
      those tests reach with the cases of rows.test.ts, which the map follows

