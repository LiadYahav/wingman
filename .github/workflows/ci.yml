# CI. Every check here is also in scripts/gate.sh, in the same order; a check
# added to one belongs in both. Nothing may fail silently: no `|| true`, no
# `|| echo`. Actions are pinned to commit SHAs with the version in a comment
# (server-scan ADR-0013); bump them deliberately, verifying the tag resolves.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: uv sync --locked
        run: uv sync --locked --all-packages --all-groups --all-extras

      - name: ruff check
        run: uv run ruff check packages/wingman-core apps/day1-service

      - name: ruff format --check
        run: uv run ruff format --check packages/wingman-core apps/day1-service

      - name: ty
        run: uv run ty check packages/wingman-core apps/day1-service

      - name: import-linter
        run: uv run lint-imports

      - name: pytest (coverage >= 90%)
        run: uv run pytest --cov --cov-fail-under=90 -q

      - name: pip-audit
        run: uv run --with pip-audit==2.10.1 pip-audit --skip-editable --progress-spinner off

      - name: deptry (wingman-core)
        working-directory: packages/wingman-core
        run: uv run --with deptry==0.24.0 deptry src --known-first-party wingman_core

      - name: deptry (day1)
        working-directory: apps/day1-service
        run: uv run --with deptry==0.24.0 deptry src --known-first-party wingman_day1

      # The legacy packages keep their old checks until they are rewritten
      # (ADR-0001). They have no tests yet; none are faked here.
      - name: legacy ruff
        run: uv run ruff check packages/shared-python apps/day2-service

      - name: legacy mypy
        run: |
          for d in packages/shared-python/src/wingman_shared apps/day2-service/src; do
            uv run mypy "$d" --ignore-missing-imports
          done

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: lint
        run: npm run lint --workspace=web

      - name: typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: build
        run: npm run build --workspace=web

  images:
    name: Image ${{ matrix.image.name }}
    needs: [python, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: day1, context: ., file: apps/day1-service/Dockerfile }
          - { name: day2, context: ., file: apps/day2-service/Dockerfile }
          - { name: web, context: apps/web, file: apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image metadata
        id: meta
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build, and push on main
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/wingman-${{ matrix.image.name }}:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/wingman-${{ matrix.image.name }}:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/wingman-${{ matrix.image.name }}:v${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
