# CI. Every check here is also in scripts/gate.sh, in the same order; a check
# added to one belongs in both. Nothing may fail silently: no `|| true`, no
# `|| echo`. Actions are pinned to commit SHAs with the version in a comment
# (server-scan ADR-0013); bump them deliberately, verifying the tag resolves.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: uv sync --locked
        run: uv sync --locked --all-packages --all-groups --all-extras

      # day2's oracle test renders the platform charts with helm, as the team's
      # render_chain.py does; the same pinned, checksum-verified helm as the chart job.
      - name: Install helm (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          # Source: https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz.sha256sum
          echo "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm

      - name: ruff check
        run: uv run ruff check packages/wingman-core apps/day2-service

      - name: ruff format --check
        run: uv run ruff format --check packages/wingman-core apps/day2-service

      - name: ty
        run: uv run ty check packages/wingman-core apps/day2-service

      - name: import-linter
        run: uv run lint-imports

      - name: pytest (coverage >= 90%)
        run: uv run pytest --cov --cov-fail-under=90 -q

      - name: pip-audit
        run: uv run --with pip-audit==2.10.1 pip-audit --skip-editable --progress-spinner off

      - name: deptry (wingman-core)
        working-directory: packages/wingman-core
        run: uv run --with deptry==0.24.0 deptry src --known-first-party wingman_core

      - name: deptry (day2)
        working-directory: apps/day2-service
        run: uv run --with deptry==0.24.0 deptry src --known-first-party wingman_day2

      # The legacy packages keep their old checks until they are rewritten
      # (ADR-0001). They have no tests yet; none are faked here.
      - name: legacy ruff
        run: uv run ruff check packages/shared-python apps/day1-service

      - name: legacy mypy
        run: |
          for d in packages/shared-python/src/wingman_shared apps/day1-service/src; do
            uv run mypy "$d" --ignore-missing-imports
          done

  chart:
    name: Chart and alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned and checksum-verified, as in herzi's CI.
      - name: Install helm (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          # Source: https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz.sha256sum
          echo "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm

      - name: Install promtool (pinned, checksum-verified)
        env:
          PROMETHEUS_VERSION: 3.15.1
          # Source: https://github.com/prometheus/prometheus/releases/download/v3.15.1/sha256sums.txt
          PROMETHEUS_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
        run: |
          set -euo pipefail
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${archive}"
          echo "${PROMETHEUS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          install -m 0755 "$RUNNER_TEMP/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool

      - name: helm lint --strict
        run: helm lint --strict chart

      - name: helm template (every chart/ci fixture)
        run: |
          for f in chart/ci/*.yaml; do
            helm template wingman chart --namespace wingman -f "$f" > /dev/null
          done

      - name: promtool check rules
        run: promtool check rules chart/files/alerts.rules.yaml

      - name: promtool test rules
        run: promtool test rules chart/tests/alerts.test.yaml

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: lint
        run: npm run lint --workspace=web

      - name: typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: build
        run: npm run build --workspace=web

  images:
    name: Image ${{ matrix.image.name }}
    needs: [python, chart, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: day1, context: ., file: apps/day1-service/Dockerfile }
          - { name: day2, context: ., file: apps/day2-service/Dockerfile }
          - { name: web, context: apps/web, file: apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image metadata
        id: meta
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build, and push on main
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/wingman-${{ matrix.image.name }}:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/wingman-${{ matrix.image.name }}:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/wingman-${{ matrix.image.name }}:v${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
