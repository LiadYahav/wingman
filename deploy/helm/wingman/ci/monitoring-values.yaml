# helm template fixture: every monitoring object on.
# Every fixture sets the Wingman tags: the chart has no default (ADR-0059).
image:
  day1: { tag: "3.33.0" }
  day2: { tag: "3.33.0" }
  web: { tag: "3.33.0" }
monitoring:
  serviceMonitor: { enabled: true, labels: { team: platform } }
  prometheusRule: { enabled: true }
  grafanaDashboard: { enabled: true, namespace: grafana }
