# helm template fixture: Quick Links with a hub, its own domain, a cluster's
# own addresses and the team's links (ADR-0052).
# Every fixture sets the Wingman tags: the chart has no default (ADR-0059).
image:
  day1: { tag: "3.33.0" }
  day2: { tag: "3.33.0" }
  web: { tag: "3.33.0" }
quickLinks:
  hubName: hub-prod
  domain: mgmt.example.internal
  clusters:
    hub-prod:
      console: https://console.hub-prod.example.internal
  sections:
    - name: Core GitOps
      columns: 2
      links:
        - name: GitLab GitOps Project
          url: https://gitlab.example.internal/platform/gitops
          icon: gitlab
        - name: ArgoCD Main
          url: https://argocd.example.internal
          icon: argocd
