apiVersion: v1
kind: ConfigMap
metadata:
  name: wingman-config
  namespace: {{ include "wingman.namespace" . }}
  labels:
    {{- include "wingman.labels" . | nindent 4 }}
data:
  # Every variable here is read by wingman_core.settings or a service's
  # settings.py (day1 and day2 share this ConfigMap); a name no service reads
  # does not belong here. Secrets are in secret.yaml.

  # ── Runtime ──────────────────────────────────────────────────────────────────
  WINGMAN_ENVIRONMENT: {{ .Values.environment | quote }}

  # ── GitLab ───────────────────────────────────────────────────────────────────
  GITLAB_URL: {{ .Values.gitlab.url | quote }}
  GITLAB_VERIFY_TLS: {{ .Values.gitlab.verifyTls | quote }}
  DAY1_GITLAB_PROJECT_ID: {{ .Values.gitlab.day1ProjectId | quote }}
  SPECS_GITLAB_PROJECT_ID: {{ .Values.gitlab.specsProjectId | quote }}
  SPECS_ROOT_PATH: {{ .Values.gitlab.specsRoot | quote }}
  DAY2_SIGS_GROUP_PATH: {{ .Values.gitlab.day2SigsGroupPath | quote }}
  DAY2_GITOPS_BRANCH: {{ .Values.gitlab.day2GitopsBranch | quote }}

  # ── day1 ─────────────────────────────────────────────────────────────────────
  # How a cluster file's stem becomes the chart's clusterName (ADR-0015):
  # production's ApplicationSet strips "ocp4-"; the GitHub sandbox keeps it ("").
  DAY1_CLUSTER_NAME_STRIP_PREFIX: {{ .Values.day1.clusterNameStripPrefix | quote }}
  DAY1_CACHE_TTL_SECONDS: {{ .Values.day1.cacheTtlSeconds | quote }}
  DAY2_SERVICE_URL: "http://wingman-day2:8002"

  # ── day2 ─────────────────────────────────────────────────────────────────────
  DAY2_CACHE_TTL_SECONDS: {{ .Values.day2.cacheTtlSeconds | quote }}

  # ── OpenShift OAuth ──────────────────────────────────────────────────────────
  OPENSHIFT_OAUTH_HOST: {{ .Values.auth.openshiftOAuthHost | quote }}
  OPENSHIFT_API_HOST: {{ .Values.auth.openshiftApiHost | quote }}
  OPENSHIFT_OAUTH_CLIENT_ID: {{ .Values.auth.oauthClientId | quote }}
  OPENSHIFT_OAUTH_REDIRECT_URI: {{ include "wingman.oauthRedirectUri" . | quote }}
  OPENSHIFT_SSL_VERIFY: {{ .Values.auth.sslVerify | quote }}

  # ── Sessions and roles ───────────────────────────────────────────────────────
  JWT_EXPIRY_HOURS: {{ .Values.auth.jwtExpiryHours | quote }}
  WINGMAN_ADMIN_GROUPS: {{ .Values.auth.adminGroups | quote }}
  WINGMAN_VIEWER_GROUPS: {{ .Values.auth.viewerGroups | quote }}

  # ── Dev auth (never in production) ───────────────────────────────────────────
  DEV_AUTH_ENABLED: {{ .Values.devAuth.enabled | quote }}

  # ── Live cluster status from the MCE hubs ────────────────────────────────────
  CLUSTER_STATUS_ENABLED: {{ .Values.clusterStatus.enabled | quote }}
  {{- if .Values.clusterStatus.enabled }}
  MCE_API_DOMAIN: {{ .Values.clusterStatus.mceDomain | quote }}
  MCE_SSL_VERIFY: {{ .Values.clusterStatus.sslVerify | quote }}
  MCE_TOKENS_FILE: "/etc/wingman/mce-tokens/tokens"
  {{- end }}

  # ── Cluster nodes from server-scan (the token: day1-deployment.yaml) ─────────
  # Each guard checks the map first and each key has a default: values reused
  # from a release before 3.4 (helm upgrade --reuse-values) have neither.
  {{- if and .Values.serverScan .Values.serverScan.url }}
  SERVER_SCAN_URL: {{ .Values.serverScan.url | quote }}
  {{- if .Values.serverScan.uiUrl }}
  SERVER_SCAN_UI_URL: {{ .Values.serverScan.uiUrl | quote }}
  {{- end }}
  SERVER_SCAN_SSL_VERIFY: {{ .Values.serverScan.sslVerify | default "true" | quote }}
  SERVER_SCAN_TIMEOUT_SECONDS: {{ .Values.serverScan.timeoutSeconds | default 10 | quote }}
  {{- end }}

  # ── Node uninstall through the workflows orchestrator ────────────────────────
  {{- if and .Values.workflows .Values.workflows.url }}
  {{- if not (and .Values.serverScan .Values.serverScan.url) }}
  {{- fail "workflows.url needs serverScan.url: an uninstall checks the server in server-scan first" }}
  {{- end }}
  WORKFLOWS_API_URL: {{ .Values.workflows.url | quote }}
  WORKFLOWS_SSL_VERIFY: {{ .Values.workflows.sslVerify | default "true" | quote }}
  WORKFLOWS_TIMEOUT_SECONDS: {{ .Values.workflows.timeoutSeconds | default 10 | quote }}
  {{- end }}

  # ── A link to segments-manager on the cluster page (day1 never calls it) ─────
  {{- if and .Values.segmentsManager .Values.segmentsManager.uiUrl }}
  SEGMENTS_MANAGER_UI_URL: {{ .Values.segmentsManager.uiUrl | quote }}
  {{- end }}

  # ── TLS CA bundle path (used when caBundle is set) ───────────────────────────
  {{- if .Values.tls.caBundle }}
  SSL_CERT_FILE: {{ .Values.tls.caBundleMountPath | quote }}
  {{- end }}

---
{{- if .Values.tls.caBundle }}
# CA bundle as a separate ConfigMap so it can be mounted as a file
apiVersion: v1
kind: ConfigMap
metadata:
  name: wingman-ca-bundle
  namespace: {{ include "wingman.namespace" . }}
  labels:
    {{- include "wingman.labels" . | nindent 4 }}
data:
  ca-bundle.crt: |
    {{- .Values.tls.caBundle | nindent 4 }}
{{- end }}
