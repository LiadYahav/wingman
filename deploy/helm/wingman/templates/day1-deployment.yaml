apiVersion: apps/v1
kind: Deployment
metadata:
  name: wingman-day1
  namespace: {{ include "wingman.namespace" . }}
  labels:
    {{- include "wingman.labels" . | nindent 4 }}
    app.kubernetes.io/component: day1
spec:
  replicas: {{ .Values.replicaCount.day1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: wingman
      app.kubernetes.io/component: day1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wingman
        app.kubernetes.io/component: day1
      annotations:
        # Force pod restart when config/secret changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "wingman.serviceAccountName" . }}
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: day1
          image: {{ include "wingman.image" (dict "registry" .Values.image.registry "image" .Values.image.day1) | quote }}
          imagePullPolicy: {{ .Values.image.day1.pullPolicy }}
          ports:
            - containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: wingman-config
            - secretRef:
                name: wingman-secrets
          {{- if and .Values.serverScan .Values.serverScan.url .Values.serverScan.tokenSecret .Values.serverScan.tokenSecret.name }}
          env:
            # server-scan's viewer token, from an existing Secret (never from values)
            - name: SERVER_SCAN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serverScan.tokenSecret.name | quote }}
                  key: {{ .Values.serverScan.tokenSecret.key | default "token" | quote }}
            {{- if .Values.serverScan.tokenSecret.adminKey }}
            # server-scan's admin token, for the maintenance toggle only; a Secret
            # without the key still starts day1, with the toggle off (ADR-0048)
            - name: SERVER_SCAN_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serverScan.tokenSecret.name | quote }}
                  key: {{ .Values.serverScan.tokenSecret.adminKey | quote }}
                  optional: true
            {{- end }}
            {{- if .Values.serverScan.tokenSecret.auditorKey }}
            # server-scan's auditor token, for the audit trail only (History,
            # Events); a Secret without the key still starts day1, with both off
            # (ADR-0048)
            - name: SERVER_SCAN_AUDITOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serverScan.tokenSecret.name | quote }}
                  key: {{ .Values.serverScan.tokenSecret.auditorKey | quote }}
                  optional: true
            {{- end }}
          {{- end }}
          volumeMounts:
            # Quick Links' links file, as a directory so edits reach a running pod (ADR-0052)
            - name: quick-links
              mountPath: /etc/wingman/quick-links
              readOnly: true
            {{- if .Values.tls.caBundle }}
            - name: ca-bundle
              mountPath: {{ .Values.tls.caBundleMountPath }}
              subPath: ca-bundle.crt
              readOnly: true
            {{- end }}
            {{- if .Values.clusterStatus.enabled }}
            - name: mce-tokens
              mountPath: /etc/wingman/mce-tokens
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources.day1 | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: quick-links
          configMap:
            name: wingman-quick-links
        {{- if .Values.tls.caBundle }}
        - name: ca-bundle
          configMap:
            name: wingman-ca-bundle
        {{- end }}
        {{- if .Values.clusterStatus.enabled }}
        - name: mce-tokens
          secret:
            secretName: {{ .Values.clusterStatus.tokensSecretName | quote }}
        {{- end }}
