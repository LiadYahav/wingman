apiVersion: apps/v1
kind: Deployment
metadata:
  name: wingman-web
  namespace: {{ include "wingman.namespace" . }}
  labels:
    {{- include "wingman.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount.web }}
  selector:
    matchLabels:
      app.kubernetes.io/name: wingman
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wingman
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "wingman.serviceAccountName" . }}
      # No pod reads the Kubernetes API with its own service-account token (day1
      # reads the MCE hubs with the tokens Secret's): none is mounted.
      automountServiceAccountToken: false
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      securityContext:
        {{- include "wingman.podSecurityContext" . | nindent 8 }}
      containers:
        - name: web
          image: {{ include "wingman.serviceImage" (list $ "web") | quote }}
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          securityContext:
            {{- include "wingman.containerSecurityContext" . | nindent 12 }}
          ports:
            - containerPort: 3000
              protocol: TCP
          # Next.js runtime env (API URLs proxied through nginx — relative paths work out of the box)
          env:
            - name: NODE_ENV
              value: "production"
          # The one path the server writes: Next.js's runtime cache. The pages
          # never write it; its image optimizer (/_next/image) does, and without
          # it a request there logs an unhandled rejection.
          volumeMounts:
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 64Mi
