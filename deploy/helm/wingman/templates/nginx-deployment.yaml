apiVersion: apps/v1
kind: Deployment
metadata:
  name: wingman-nginx
  namespace: {{ include "wingman.namespace" . }}
  labels:
    {{- include "wingman.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ .Values.replicaCount.nginx }}
  selector:
    matchLabels:
      app.kubernetes.io/name: wingman
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wingman
        app.kubernetes.io/component: nginx
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/nginx-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "wingman.serviceAccountName" . }}
      # No pod reads the Kubernetes API with its own service-account token (day1
      # reads the MCE hubs with the tokens Secret's): none is mounted.
      automountServiceAccountToken: false
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      securityContext:
        {{- include "wingman.podSecurityContext" . | nindent 8 }}
      containers:
        - name: nginx
          image: {{ include "wingman.nginxImage" . | quote }}
          imagePullPolicy: {{ .Values.image.nginx.pullPolicy }}
          securityContext:
            {{- include "wingman.containerSecurityContext" . | nindent 12 }}
          # The UBI image's own command prints an S2I usage note and exits, so
          # nginx is started here. -e: its start-up errors go to stderr too,
          # before it reads nginx.conf (the compiled-in log file is read-only).
          command: ["nginx", "-e", "/dev/stderr", "-g", "daemon off;"]
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            # Where nginx.conf puts the pid and the temp files: a body or an
            # answer larger than its buffers waits here.
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources.nginx | nindent 12 }}
          # nginx answers /healthz itself (ADR-0058): neither probe waits on the web.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: wingman-nginx
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wingman-nginx
  namespace: {{ include "wingman.namespace" . }}
  labels:
    {{- include "wingman.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  selector:
    app.kubernetes.io/name: wingman
    app.kubernetes.io/component: nginx
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
