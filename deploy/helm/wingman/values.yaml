# ══════════════════════════════════════════════════════════════════════════════
# Wingman Helm Values
#
# AIR-GAPPED DEPLOYMENT CHECKLIST
# ────────────────────────────────
# Fields marked [AIR-GAPPED] must be changed for air-gapped / on-prem networks:
#   1. image.registry      → your internal container registry
#   2. gitlab.*            → your internal GitLab instance
#   3. auth.*              → your OpenShift OAuth settings
#   4. tls.caBundle        → your internal CA certificate (PEM)
#   5. route.host          → your actual OpenShift cluster domain
# ══════════════════════════════════════════════════════════════════════════════

# ── Container images ───────────────────────────────────────────────────────────
image:
  # [AIR-GAPPED] Replace with your internal registry
  # Example: registry.internal/wingman
  registry: ""   # if empty, images are pulled without a registry prefix

  # [VERSIONING] Set every tag to the release you deploy, the same for all
  # three images. Example: tag: "3.0.1"  (the GitHub release v3.0.1; no "v").
  # Every merge to main is a release (docs/ops/images.md). "latest", "3.0" and
  # "3" move and "sha-..." names no release: production pins a full version,
  # so releases are traceable and rollbacks are safe. "latest" is for local dev.

  day1:
    repository: wingman-day1
    tag: "latest"
    pullPolicy: IfNotPresent

  day2:
    repository: wingman-day2
    tag: "latest"
    pullPolicy: IfNotPresent

  web:
    repository: wingman-web
    tag: "latest"
    pullPolicy: IfNotPresent

  nginx:
    # [AIR-GAPPED] Replace with mirror of nginx in your registry
    repository: nginx
    tag: "latest"
    pullPolicy: IfNotPresent

# ── GitLab connection ──────────────────────────────────────────────────────────
gitlab:
  # [AIR-GAPPED] Your internal GitLab URL
  url: "https://gitlab.internal"

  # [AIR-GAPPED] Personal or project access token with api + read_repository + write_repository scope
  # Generate at: GitLab → User Settings → Access Tokens
  # IMPORTANT: Set this via --set or a separate secrets file, never commit the token
  accessToken: ""

  # GitLab project IDs or "group/subgroup/project" path strings
  # Find at: GitLab project → Settings → General → Project ID
  day1ProjectId: ""         # e.g. "42" or "platform-team/day1-config"
  day2SigsGroupPath: ""    # GitLab path to the sigs subgroup e.g. "platform-team/sigs"
  specsProjectId: ""        # e.g. "44" or "platform-team/cluster-specs"

  specsRoot: "specs"        # folder of the spec files inside specsProjectId
  # The branch the platform's generators read and day2's MRs target.
  day2GitopsBranch: "main"
  # TLS verification for GitLab API calls: true or false. An internal CA goes
  # in tls.caBundle (mounted and named by SSL_CERT_FILE), not here.
  verifyTls: true
  # Webhook secret — GitLab will send this in X-Gitlab-Token header
  # Set in GitLab: Project → Settings → Webhooks → Secret token
  webhookSecret: ""

# ── Runtime ────────────────────────────────────────────────────────────────────
# production refuses the in-memory GitLab and weak dev login (ADR-0009).
environment: "production"

# ── day1 and day2 ──────────────────────────────────────────────────────────────
day1:
  # Stripped from a cluster file's name to make the chart's clusterName
  # (ADR-0015): "ocp4-" as production's ApplicationSet does, "" for the sandbox.
  clusterNameStripPrefix: "ocp4-"
  cacheTtlSeconds: 30     # GitLab reads, per replica (ADR-0011; at most 60)
  # How a create is proposed (ADR-0042): "merge-request" (Wingman opens the MR)
  # or "workflow" (Wingman starts the platform's provision-cluster workflow,
  # which opens it; needs workflows.url, which needs serverScan.url).
  provisioner: merge-request
  # MCE placement (ADR-0050): Wingman picks a new cluster's MCE. The cost of one
  # hosted control plane: with clusterStatus.enabled, an MCE is offered only with
  # at least this many free pods (allocatable less in use) on its workers
  # (masters, infra nodes and tainted, cordoned or NotReady nodes left out).
  # Without live status the free pods are not checked.
  placementMinFreePods: 70
  # Upgrades through the platform's upgrade-cluster workflow (ADR-0055): the
  # cluster page starts it, shows its run and sends its decisions; while on, an
  # edit may not change mastertag or a workertag, nor add pausedUntil. Needs
  # workflows.url, and the workflow must read the same day1 repo as Wingman.
  upgrades:
    enabled: false
  # Inventory Management (ADR-0057): admins add servers to an MCE's InfraEnv
  # pool by starting the platform's add-server-to-mce workflow. Needs
  # workflows.url; the page itself needs serverScan.url, and the InfraEnvs
  # come from the MCE (clusterStatus.enabled).
  addServers:
    enabled: false
day2:
  cacheTtlSeconds: 15     # GitLab reads, per replica (ADR-0011; at most 60)

# ── OpenShift OAuth ────────────────────────────────────────────────────────────
# [AIR-GAPPED] All values come from your OpenShift cluster
auth:
  # Hostname of your OpenShift OAuth server
  # Find at: oc get route oauth-openshift -n openshift-authentication -o jsonpath='{.spec.host}'
  openshiftOAuthHost: "oauth-openshift.apps.your-cluster.internal"

  # Kubernetes API server (used to validate tokens via users/~ endpoint)
  # Find at: oc whoami --show-server
  openshiftApiHost: "api.your-cluster.internal:6443"

  # OAuthClient name — must match the CR deployed by this chart
  oauthClientId: "wingman-app"

  # SSL verification for OpenShift OAuth/API calls
  # "true" → verify using system CAs, "false" → skip (internal self-signed certs), or CA bundle path
  sslVerify: "false"

  # OAuthClient secret — generate a random string, e.g.: openssl rand -hex 32
  # IMPORTANT: Set via --set or secrets file
  oauthClientSecret: ""

  # Full URL where OpenShift will redirect after login
  # Must exactly match one of the OAuthClient's redirectURIs
  # Format: https://{route.host}/login
  oauthRedirectUri: ""  # auto-populated from route.host if left empty

  # JWT signing secret — generate with: openssl rand -hex 32
  # IMPORTANT: Set via --set or secrets file
  jwtSecret: ""
  jwtExpiryHours: 8

  # ── Group-based access control ─────────────────────────────────────────────
  # Comma-separated OpenShift group names
  # Create groups: oc adm groups new wingman-admins && oc adm groups add-users wingman-admins <user>
  adminGroups: "wingman-admins"
  viewerGroups: ""   # leave empty to disable viewer role

# ── Dev auth (minikube / local testing ONLY) ──────────────────────────────────
# When enabled, replaces OpenShift OAuth with a simple secret-based login.
# NEVER enable in production.
devAuth:
  enabled: false
  secret: ""  # generate with: openssl rand -hex 16

# ── Routing ────────────────────────────────────────────────────────────────────
route:
  # [AIR-GAPPED] Your OpenShift application domain
  # Find at: oc get ingresses.config cluster -o jsonpath='{.spec.domain}'
  host: "wingman.apps.your-cluster.internal"

# OpenShift Route (set enabled: true on OpenShift)
openshiftRoute:
  enabled: true
  tls:
    termination: edge        # edge | passthrough | reencrypt
    insecureEdgeTerminationPolicy: Redirect

# Standard Kubernetes Ingress (set enabled: true on plain k8s / minikube)
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  host: "wingman.local"  # add to /etc/hosts pointing to minikube IP

# ── TLS / CA bundle ────────────────────────────────────────────────────────────
tls:
  # [AIR-GAPPED] Paste your internal CA certificate (PEM format) here.
  # This is mounted into all pods so they can verify internal TLS certs.
  # Get it: oc get cm -n openshift-config-managed default-ingress-cert -o jsonpath='{.data.ca-bundle\.crt}'
  # Or export from your PKI.
  caBundle: ""   # paste multi-line PEM cert here (use | in YAML)
  # When caBundle is set, this path is where it's mounted inside pods
  caBundleMountPath: "/etc/pki/tls/certs/ca-bundle.crt"

# ── Image pull secret ──────────────────────────────────────────────────────────
# Name of an existing secret with registry credentials.
# Create with: kubectl create secret docker-registry wingman-registry \
#   --docker-server=<registry> --docker-username=<user> --docker-password=<token> \
#   -n wingman
imagePullSecret: ""   # leave empty if registry is unauthenticated

# ── RBAC / Service account ─────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: "wingman"

# ── Resource requests/limits ───────────────────────────────────────────────────
resources:
  day1:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  day2:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  web:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

  nginx:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

# ── Replica counts ─────────────────────────────────────────────────────────────
replicaCount:
  day1: 1
  day2: 1
  web: 1
  nginx: 1

# ── Live cluster status (OpenShift/HyperShift only) ───────────────────────────
# Disabled by default. Cannot be used on minikube — requires real MCE clusters.
# When enabled, the day1-service queries each MCE's OpenShift API using SA tokens
# stored in a Kubernetes secret.
#
# Secret format (key: tokens), a YAML map of MCE folder name to its token, or to
# its token and its own API address (ADR-0045):
#   ocp4-prod-mce-site1-a: <SA-token>                 # https://api.{mce}.{mceDomain}:6443
#   ocp4-prod-mce-site1-b:
#     token: <SA-token>
#     url: https://api.hub-b.example.com:6443         # a hub off that pattern; https, no path
#
# The same access serves live status, InfraEnvs, the cluster nodes and MCE
# placement (each needs its reads: the chart README's "Live cluster status").
clusterStatus:
  enabled: false
  mceDomain: ""           # e.g. "openshift.example.com" → https://api.{mce}.openshift.example.com:6443 (unless the MCE has its own url)
  tokensSecretName: "mce-sa-tokens"  # name of the k8s secret holding SA tokens
  sslVerify: "false"                 # set to "true" or CA bundle path for production

# ── Cluster nodes from server-scan (ADR-0038) ─────────────────────────────────
# Off by default. With a url, day1 lists the servers under each hosted cluster
# from server-scan's API; the node links point at its UI.
serverScan:
  url: ""                 # the API, e.g. "http://server-scan-api.<ns>.svc:8000"; empty: off
  uiUrl: ""               # the UI, e.g. "https://server-scan.example"; empty: url
  sslVerify: "true"       # "true", "false" or a CA bundle path
  timeoutSeconds: 10      # per request, at most 60
  # A viewer token (sent as "Authorization: Bearer"), from an existing Secret:
  #   oc create secret generic server-scan-viewer -n <ns> --from-literal=token=<token>
  # Empty name: no token, for a server-scan with auth off. Never put the token
  # itself in values. day1 reads it at start: restart day1 after rotating it.
  tokenSecret:
    name: ""
    key: "token"

# ── Node uninstall through the workflows orchestrator (ADR-0038) ──────────────
# Off by default. With a url, day1 starts the platform's uninstall-server-from-hc
# workflow and shows its run. The orchestrator has no auth. Needs serverScan.url
# (an uninstall checks the server in server-scan first): the chart fails without it.
workflows:
  url: ""                 # e.g. "http://workflows-orchestrator-api.<ns>.svc:8080"; empty: off
  sslVerify: "true"       # "true", "false" or a CA bundle path
  timeoutSeconds: 10      # per request, at most 60
  targetsTimeoutSeconds: 65  # the upgrade targets read (the orchestrator waits up to 60 s), at most 120

# ── segments-manager: the cluster's EPG, checked against Git (ADR-0039) ───────
# Off by default. With a url, the cluster page's "HostedCluster & network" card
# shows the EPG segments-manager records for the cluster's segment, and warns
# where segments-manager disagrees with the cluster file (the VLAN and segment
# shown are always the file's). day1 only reads one segment (its reads need no
# token) and never writes. The card also links to the UI and to its search for
# the cluster's segment (JSON): uiUrl, or url when uiUrl is empty.
segmentsManager:
  url: ""                 # the API, e.g. "http://segments-manager.<ns>.svc:8000"; empty: no EPG
  uiUrl: ""               # the UI, e.g. "https://segments-manager.example"; empty: url (none: no link)
  sslVerify: "true"       # "true", "false" or a CA bundle path
  timeoutSeconds: 5       # per request, at most 60

# ── Quick Links: the launcher page (ADR-0052; admins only) ────────────────────
# A card for the hub Wingman runs on and one for every MCE of the day1 repo, by
# site: each opens the cluster's ArgoCD, with its console beside it. Then the
# team's own links (`sections`). Wingman only lists the links: it never calls
# them (no status dots or ArgoCD counts since 3.13.1). `sections` and
# `clusters` are rendered into the ConfigMap wingman-quick-links, which day1
# re-reads on every page load: an edit shows within about a minute, without a
# restart.
quickLinks:
  hubName: ""             # the hub's cluster name, as in apps.<hubName>.<domain>; empty: no hub card
  hubDomain: ""           # the hub's domain; empty: `domain`
  domain: ""              # the MCEs' domain; empty: clusterStatus.mceDomain
  argocdUrlTemplate: "https://openshift-gitops-server-openshift-gitops.apps.{cluster}.{domain}"
  consoleUrlTemplate: "https://console-openshift-console.apps.{cluster}.{domain}"
  # A cluster whose addresses don't follow the templates:
  #   clusters:
  #     hub-prod:
  #       argocd: https://gitops.hub-prod.example.internal
  #       console: https://console.hub-prod.example.internal
  clusters: {}
  # The team's links, after the generated sections (docs/notes/2026-11-12-quick-links-api.md §3):
  #   sections:
  #     - name: Core GitOps
  #       columns: 2                    # 1 to 6, default 4
  #       links:
  #         - name: GitLab GitOps Project
  #           url: https://gitlab.example.internal/platform/gitops
  #           description: Main GitOps repository
  #           icon: gitlab              # a key: argocd, gitlab, openshift, grafana, confluence, cisco, dell, ...
  #         - name: ArgoCD Main
  #           url: https://argocd.example.internal
  #           icon: argocd
  sections: []

# ── Namespace ──────────────────────────────────────────────────────────────────
# Override with --namespace on helm install
namespace: ""  # defaults to .Release.Namespace

# ── Monitoring (ADR-0010; docs/ops/metrics.md, docs/ops/runbook.md) ───────────
# day1 and day2 serve /metrics on their own port (never through the Route).
# Everything here needs the Prometheus Operator CRDs (monitoring.coreos.com);
# on OpenShift, enable user-workload monitoring first. All off by default.
monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}            # extra labels, if your Prometheus selects ServiceMonitors by label
  prometheusRule:
    enabled: false
    labels: {}            # e.g. { role: alert-rules } if your Prometheus selects rules by label
  grafanaDashboard:
    enabled: false        # a ConfigMap for Grafana's dashboard sidecar
    namespace: ""         # where the sidecar looks; defaults to the release namespace
    label: grafana_dashboard
    labelValue: "1"
